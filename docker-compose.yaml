services:
  sales-db:
    image: postgres:17
    container_name: sales-db
    ports:
      - "${SALES_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${SALES_DB_NAME}
      POSTGRES_USER: ${SALES_DB_USER}
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SALES_DB_USER} -d ${SALES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sales-pgadmin:
    image: dpage/pgadmin4
    container_name: sales-pgadmin
    ports:
      - "${SALES_PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SALES_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${SALES_PGADMIN_PASSWORD}
    volumes:
      - sales_pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      sales-db:
        condition: service_healthy

volumes:
  postgres_data:
  sales_pgadmin_data:
