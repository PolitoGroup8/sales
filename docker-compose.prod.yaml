
services:
  sales:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales
    ports:
      - "${SALES_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sales-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      sales-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sales-network

  sales-db:
    image: postgres:17
    container_name: sales-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sales-network

volumes:
  postgres_prod_data:

networks:
  sales-network:
    driver: bridge
