spring:
  application:
    name: sales
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true

  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2.0
          max-retries: 3